name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: DSH ${{ matrix.dsh }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dsh: 0.1.1-rc.2
            ref: dsh-v0.1.1-rc.2
          - dsh: 0.1.2-alpha.2
            ref: 0a53fb55bea101816fa226bb964ae2bed71c343b
    steps:
      - name: Check out plugin
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.19.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Check out and build DeepSeek Harness
        env:
          DSH_REF: ${{ matrix.ref }}
        run: |
          git clone --filter=blob:none https://github.com/deepseek-ai/deepseek-harness.git "$RUNNER_TEMP/deepseek-harness"
          git -C "$RUNNER_TEMP/deepseek-harness" checkout "$DSH_REF"
          pnpm --dir "$RUNNER_TEMP/deepseek-harness" install --frozen-lockfile
          pnpm --dir "$RUNNER_TEMP/deepseek-harness" run build

      - name: Build, typecheck, and test plugin
        env:
          DSH_CHECKOUT: ${{ runner.temp }}/deepseek-harness
        run: node scripts/test.mjs

      - name: Validate package
        run: |
          "$RUNNER_TEMP/deepseek-harness/node_modules/.bin/publint"
          npm pack --dry-run
